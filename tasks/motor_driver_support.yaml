  max_bom_cost_usd: 4.00
allowed_parts:
  - motor_driver_drv8833
  - motor_driver_drv8871
  - diode_schottky_sma
  - diode_schottky_sod123
  - cap_0603_100n
  - cap_0805_10u
  - cap_tant_10u
  - test_point_smd
