name: motor_driver_support
description: A DRV8833 motor driver with decoupling and bulk capacitor on VM.
requirements:
  - "A dual H-bridge motor driver powered from a motor supply VM"
  - "Decoupling capacitor on VM to GND"
  - "Bulk capacitor on VM to GND"
  - "Flyback protection appropriate for an inductive motor load"
