name: usb_c_power_input
description: A USB-C power input front-end with ESD protection and bulk decoupling.
requirements:
  - "USB-C receptacle configured as a 5V sink"
  - "5.1k pulldown on CC1"
  - "5.1k pulldown on CC2"
  - "TVS diode on VBUS for ESD protection"
  - "Bulk capacitor on VBUS to GND"
objectives:
  erc_weight: 3.0
  graph_rule_weight: 2.0
  electrical_rule_weight: 4.0
  cost_weight: 1.0
  size_weight: 1.0
  availability_weight: 1.0
  llm_critic_weight: 2.0
preferences:
  package_type: SMD
  max_bom_cost_usd: 3.00
allowed_parts:
  - usb_c_receptacle_hro
  - usb_c_receptacle_gct
  - resistor_0402
  - resistor_0603
  - tvs_sod323
  - cap_0805_10u
  - cap_1206_10u
  - test_point_smd
