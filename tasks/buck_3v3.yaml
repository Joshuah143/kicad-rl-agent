name: buck_3v3
description: "Step-down (buck) regulator: 12 V in -> 3.3 V out. Assemble a complete non-synchronous buck around the controller IC."
requirements:
  - "A non-synchronous buck controller IC (integrated switch) from VIN (12V) to a 3.3V output rail"
  - "Input capacitor on VIN to GND"
  - "A power inductor on the switch (SW) node to the output rail"
  - "Output capacitor on the 3.3V rail to GND"
  - "A feedback resistor divider: one resistor VOUT->FB, one resistor FB->GND"
  - "A catch/freewheel Schottky diode on SW to GND (cathode to SW)"
  - "EN connected (e.g. tied to VIN or pulled up to enable the converter)"
objectives:
  erc_weight: 3.0
  graph_rule_weight: 2.0
  electrical_rule_weight: 6.0
  cost_weight: 1.0
  size_weight: 0.5
  availability_weight: 1.0
  llm_critic_weight: 2.0
preferences:
  package_type: SMD
  max_bom_cost_usd: 3.00
allowed_parts:
  - buck_mp1584
  - buck_lm2596
  - inductor_4u7_power
  - inductor_10uh_power
  - inductor_22uh_power
  - diode_schottky_sod123
  - diode_schottky_sma
  - cap_0805_10u
  - cap_1206_10u
  - cap_0805_1u
  - cap_0603_100n
  - resistor_0402
  - resistor_0603
  - resistor_0805
  - test_point_smd
