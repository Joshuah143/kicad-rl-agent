name: i2c_sensor_breakout
description: A generic I2C sensor breakout with bus pullups and decoupling.
requirements:
  - "Generic I2C sensor powered from +3V3"
  - "Pullup resistor on SDA to +3V3"
  - "Pullup resistor on SCL to +3V3"
  - "Decoupling capacitor on the sensor VDD to GND"
objectives:
  erc_weight: 3.0
  graph_rule_weight: 2.0
  electrical_rule_weight: 4.0
  cost_weight: 1.0
  size_weight: 0.5
  availability_weight: 1.0
  llm_critic_weight: 2.0
preferences:
  package_type: SMD
  min_hand_solderable: "0603"
  max_bom_cost_usd: 1.50
allowed_parts:
  - i2c_sensor_generic
  - resistor_0603
  - cap_0603_100n
  - test_point_smd
